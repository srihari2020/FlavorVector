services:
  flavorvector-ui:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501

  flavorvector-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
